name: Validate and package JattBeat integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile API
        run: python -m py_compile app.py

  wordpress-plugin-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: Lint WordPress plugin
        run: php -l wordpress/preet-song-catalog/preet-song-catalog.php

  package-wordpress-plugin:
    needs: [python-syntax, wordpress-plugin-php]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin ZIP
        run: |
          mkdir -p dist
          cd wordpress
          zip -r ../dist/JattBeat-Song-Catalog.zip preet-song-catalog
      - uses: actions/upload-artifact@v4
        with:
          name: JattBeat-Song-Catalog
          path: dist/JattBeat-Song-Catalog.zip
          if-no-files-found: error
